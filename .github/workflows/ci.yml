name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp build
      - run: vp run build:management
      - run: vp run smoke:management
      - run: vp run check:sensitive
      - run: vp run check:licenses
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:e2e
        env:
          E2E_API_DOCKER: "1"
